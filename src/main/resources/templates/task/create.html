<form th:action="@{/tasks/create}" th:object="${taskform}" method="post">

    <input type="hidden" name="subprojectId" th:value="${subprojectId}"/>

    <div class="form-group">
        <label>Titel: *</label>

        <input type="text"
               th:field="*{title}"
               th:classappend="${#fields.hasErrors('title')} ? 'error-input' : ''" />

        <div th:if="${#fields.hasErrors('title')}" class="error-text">
            <p th:errors="*{title}"></p>
        </div>
    </div>

    <div class="form-group">
        <label>Beskrivelse:</label>
        <textarea th:field="*{description}"></textarea>
    </div>

    <div class="form-group">
        <label>Estimerede timer: *</label>

        <input type="number"
               step="0.1"
               th:field="*{estimatedTime}"
               th:classappend="${#fields.hasErrors('estimatedTime')} ? 'error-input' : ''" />

        <div th:if="${#fields.hasErrors('estimatedTime')}" class="error-text">
            <p th:errors="*{estimatedTime}"></p>
        </div>
    </div>

    <div class="form-group">
        <label>Deadline</label>
        <input type="date" th:field="*{deadline}" />
    </div>

    <button type="submit">Opret opgave</button>

</form>
