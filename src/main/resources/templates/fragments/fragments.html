<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">

<header th:fragment="header" class="bg-white border-b border-gray-200 shadow-sm">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex flex-col gap-4 py-4 md:flex-row md:items-center md:justify-between">
            <div class="flex flex-col gap-4 md:flex-row md:items-center md:gap-8">
                <a th:href="@{/}" class="text-lg font-bold text-gray-900 hover:text-blue-600 transition">
                    PCT
                </a>

                <nav class="flex flex-wrap items-center gap-2 sm:gap-4 text-sm font-medium text-gray-600">
                    <a th:href="@{/}"
                       class="rounded-md px-3 py-2 transition hover:bg-gray-100 hover:text-gray-900">
                        Forside
                    </a>
                    <a th:href="@{/projects}"
                       class="rounded-md px-3 py-2 transition hover:bg-gray-100 hover:text-gray-900">
                        Projekter
                    </a>
                    <a th:href="@{/resources}"
                       class="rounded-md px-3 py-2 transition hover:bg-gray-100 hover:text-gray-900">
                        Ressourcer
                    </a>
                </nav>
            </div>

            <div class="flex items-center justify-between gap-3 md:justify-end">
                <div class="flex items-center gap-2">
                    <a th:if="${session.userId != null}" th:href="@{/users/logout}"
                            class="inline-flex items-center rounded-lg bg-gray-900 px-3 py-2 text-sm font-medium text-white transition hover:bg-gray-700">
                        Log ud
                    </a>
                    <a th:if="${session.userId == null}" th:href="@{/users/register}"
                       class="inline-flex items-center rounded-lg border border-gray-200 px-3 py-2 text-sm font-medium text-gray-700 transition hover:bg-gray-100">
                        Opret bruger
                    </a>
                    <a th:if="${session.userId == null}" th:href="@{/users/login}"
                       class="inline-flex items-center rounded-lg bg-gray-900 px-3 py-2 text-sm font-medium text-white transition hover:bg-gray-700">
                        Log ind
                    </a>
                </div>
            </div>
        </div>
    </div>
</header>


<footer th:fragment="footer" class="mt-12 border-t border-gray-200 bg-white">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
        <div class="flex flex-col gap-2 text-center sm:flex-row sm:items-center sm:justify-between sm:text-left">
            <p class="text-sm text-gray-500">&copy; 2026 Kodebutikken. Alle rettigheder forbeholdes.</p>
            <p class="text-sm text-gray-400">PCT - Project Calculation Tool</p>
        </div>
    </div>
</footer>
</html>
