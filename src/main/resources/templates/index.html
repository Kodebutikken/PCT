<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PCT - Project Calculation Tool</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-50 flex flex-col">
<header th:replace="~{fragments/fragments :: header}"></header>

<main class="flex-1 flex items-center justify-center px-4 py-16">
    <div class="bg-white border border-gray-200 rounded-2xl shadow-sm w-full max-w-lg p-10 text-center">

        <span class="inline-block rounded-full bg-gray-900 text-white text-xs font-semibold tracking-wide px-3 py-1 mb-6">
            PCT
        </span>

        <h1 class="text-3xl font-bold text-gray-900 leading-tight">
            Project Calculation Tool
        </h1>

        <p class="text-base text-gray-500 mt-3 leading-relaxed">
            Planlæg projekter, estimer timer og beregn projektomkostninger &mdash; alt samlet ét sted.
        </p>

        <div class="border-t border-gray-100 my-8"></div>

        <div class="flex flex-col sm:flex-row gap-3 justify-center">
            <a th:href="@{/users/login}">
                <button type="button"
                        class="w-full sm:w-auto bg-gray-900 text-white px-6 py-2.5 rounded-lg text-sm font-medium hover:bg-gray-700 transition">
                    Log ind
                </button>
            </a>
            <a th:href="@{/users/register}">
                <button type="button"
                        class="w-full sm:w-auto border border-gray-300 text-gray-700 bg-white px-6 py-2.5 rounded-lg text-sm font-medium hover:bg-gray-50 transition">
                    Opret bruger
                </button>
            </a>
        </div>

        <p class="mt-8 text-xs text-gray-400">Kodebutikken &middot; 2026</p>
    </div>
</main>

<footer th:replace="~{fragments/fragments :: footer}"></footer>
</body>
</html>
