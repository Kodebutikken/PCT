<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="da">
<head>
    <meta charset="UTF-8">
    <title>PCT - Project Management Tool</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-50 flex flex-col">
<header th:replace="~{fragments/fragments :: header}"></header>
<main class="flex-1 w-full flex justify-center items-center">
    <div class="bg-white border border-gray-200 rounded-xl p-8 w-full max-w-lg">
        <h1 class="text-2xl font-bold mb-4">Velkommen til Project Calculation Tool</h1>
        <p class="text-gray-700">PCT er en enkel og brugervenlig projekt kalkulerings værktøj.</p>
        <div class="flex justify-center space-x-4 mt-6">
            <a th:href="@{/users/login}">
                <button type="button"
                        class="bg-blue-500 text-white py-2 px-4 rounded-lg text-sm font-medium hover:bg-blue-600 transition">
                    Log ind
                </button>
            </a>
            <a th:href="@{/users/register}">
                <button type="button"
                        class="bg-gray-900 text-white py-2 px-4 rounded-lg text-sm font-medium hover:bg-gray-700 transition">
                    Opret bruger
                </button>
            </a>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/fragments :: footer}"></footer>
</body>
</html>
