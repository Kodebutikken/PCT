<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projekter - PCT</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-50 flex flex-col">
<header th:replace="~{fragments/fragments :: header}"></header>

<main class="flex-1 w-full max-w-5xl mx-auto px-4 py-10">

    <div class="flex items-center justify-between mb-6">
        <h1 class="text-2xl font-semibold text-gray-900">Projekter</h1>
        <a th:if="${canCreateProjects}" th:href="@{/projects/create}">
            <button type="button"
                    class="bg-green-500 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-green-600 transition">
                Opret nyt projekt
            </button>
        </a>
    </div>

    <div th:if="${#lists.isEmpty(projects)}"
         class="bg-white border border-gray-200 rounded-2xl p-10 text-center">
        <a th:if="${canCreateProjects}" th:href="@{/projects/create}">
            <p class="text-sm text-gray-500 mb-4">Du har ingen projekter endnu. Tryk her for at komme i gang!</p>
            <button type="button"
                    class="bg-green-500 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-green-600 transition">
                Opret dit første projekt
            </button>
        </a>
        <p class="text-sm text-gray-500" th:unless="${canCreateProjects}">Du har ingen projekter endnu.<br>Få din leder
            til at oprette et projekt
        </p>
    </div>

    <div th:unless="${#lists.isEmpty(projects)}" class="space-y-3">
        <div th:each="project : ${projects}"
             class="bg-white border border-gray-200 rounded-2xl p-5 flex items-center justify-between gap-6 hover:shadow-sm transition">

            <div class="flex-1 min-w-0">
                <p class="text-base font-semibold text-gray-900 truncate" th:text="${project.title}">Projektnavn</p>
                <p class="text-sm text-gray-500 line-clamp-1 mt-0.5"
                   th:if="${project.description != null and !#strings.isEmpty(project.description)}"
                   th:text="${project.description}">Beskrivelse</p>
            </div>

            <div class="hidden sm:block text-right flex-shrink-0">
                <p class="text-xs text-gray-400">Deadline</p>
                <p class="text-sm font-medium text-gray-700"
                   th:if="${project.deadline != null}"
                   th:text="${#temporals.format(project.deadline, 'dd/MM-yyyy')}"></p>
                <p class="text-sm text-gray-400 italic" th:if="${project.deadline == null}">Ingen</p>
            </div>

            <div class="flex items-center gap-2 flex-shrink-0">
                <a th:href="@{/projects/{id}(id=${project.id})}">
                    <button type="button"
                            class="bg-gray-900 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-gray-700 transition">
                        Se detaljer
                    </button>
                </a>
                <form th:action="@{|/projects/${project.id}/delete|}" method="post"
                      onsubmit="return confirm('Er du sikker på, at du vil slette dette projekt?');">
                    <button type="submit"
                            class="border border-red-200 text-red-600 px-4 py-2 rounded-lg text-sm font-medium hover:bg-red-50 transition">
                        Slet
                    </button>
                </form>
            </div>
        </div>
    </div>

</main>

<footer th:replace="~{fragments/fragments :: footer}"></footer>
</body>
</html>
