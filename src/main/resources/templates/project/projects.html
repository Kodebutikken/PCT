<h1>Dine projekter</h1>

<div th:each="project : ${projects}" style="margin-bottom: 30px;">

    <div style="border: 2px solid black; padding: 10px;">
        <h2 th:text="${project.title}"></h2>
        <p th:text="${project.description}"></p>

        <a th:href="@{'/subprojects/' + ${project.id} + '/subprojects/create'}">
            + Opret delprojekt
        </a>
    </div>

    <div style="margin-left: 30px; margin-top: 10px;">
        <h4>Delprojekter</h4>

        <div th:if="${#lists.isEmpty(project.subprojects)}">
            <em>Ingen delprojekter</em>
        </div>

        <ul th:each="sp : ${project.subprojects}">
            <li style="border-left: 3px solid #666; padding-left: 10px; margin-bottom: 5px;">
                <strong th:text="${sp.title}"></strong>
                <p th:text="${sp.description}"></p>
                <small th:text="${sp.deadline}"></small>

                <a th:href="@{'/subprojects/' + ${sp.id} + '/tasks'}">
                    Se tasks
                </a>
            </li>
        </ul>
    </div>

</div>
