<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="da">
<head>
    <meta charset="UTF-8">
    <title>Projekter</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-50 flex items-center justify-center">


<div class="bg-white border border-gray-200 rounded-xl p-8 w-full max-w-md">
    <h1 class="text-xl font-medium text-gray-900 mb-1">Projekter</h1>

    <table class="w-full border border-gray-200 rounded-lg mt-4">
        <thead>
            <tr class="bg-gray-100">
                <th class="text-left px-4 py-2">Projekt Navn</th>
                <th class="text-left px-4 py-2">Beskrivelse</th>
                <th class="text-left px-4 py-2">Handlinger</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="project : ${projects}" class="border-t border-gray-200 hover:bg-gray-50">
                <td class="px-4 py-2" th:text="${project.title}">Projekt Navn</td>
                <td class="px-4 py-2" th:text="${project.description}">Projekt Beskrivelse</td>
                <td class="px-4 py-2">
                    <a th:href="@{/projects/{id}(id=${project.id})}">
                    <button class="bg-blue-500 text-white px-3 py-1 rounded hover:bg-blue-600">
                        Se Detaljer
                    </button>
                </td>
            </tr>
        </tbody>
    </table>
    <a th:href="@{/projects/create}">
    <button class="mt-4 bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">
        Opret Nyt Projekt
    </button>
    </a>
</div>
</body>
</html>
