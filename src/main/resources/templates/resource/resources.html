<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ressourcer - PCT</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-50 flex flex-col">
<header th:replace="~{fragments/fragments :: header}"></header>

<main class="flex-1 w-full max-w-5xl mx-auto px-4 py-10">

    <div class="flex items-center justify-between mb-6">
        <h1 class="text-2xl font-semibold text-gray-900">Ressourcer</h1>
        <a th:href="@{/resources/create}" th:if="${canEditResources}"
           class="inline-flex items-center gap-2">
            <button type="button"
                    class="bg-green-500 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-green-600 transition">
                Opret ny ressource
            </button>
        </a>
    </div>

    <div th:if="${#lists.isEmpty(resources)}"
         class="bg-white border border-gray-200 rounded-2xl p-10 text-center">
        <p class="text-sm text-gray-400 italic">Ingen ressourcer oprettet endnu.</p>
        <a th:href="@{/resources/create}">
            <button type="button"
                    class="bg-green-500 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-green-600 transition mt-4">
                Opret Din Første Ressource
            </button>
        </a>
    </div>

    <div th:unless="${#lists.isEmpty(resources)}" class="space-y-3">
        <div th:each="resource : ${resources}"
             class="bg-white border border-gray-200 rounded-2xl p-5 flex items-center justify-between gap-6">

            <div class="flex-1 min-w-0">
                <p class="text-base font-semibold text-gray-900 truncate" th:text="${resource.name}">Navn</p>
                <p class="text-sm text-gray-500 mt-0.5" th:text="${resource.skills}">Kompetencer</p>
            </div>

            <div class="hidden sm:flex items-center gap-8 flex-shrink-0">
                <div class="text-right">
                    <p class="text-xs text-gray-400">Daglige timer</p>
                    <p class="text-sm font-medium text-gray-700"
                       th:text="${resource.dailyWorkingHours} + ' timer'">0</p>
                </div>
                <div class="text-right">
                    <p class="text-xs text-gray-400">Timeløn</p>
                    <p class="text-sm font-medium text-gray-700" th:if="${canEditResources}"
                       th:text="${#numbers.formatInteger(resource.hourlyWage, 1, 'POINT')} + ' DKK/t'">0 DKK/t</p>
                    <p class="text-sm font-medium text-gray-700" th:unless="${canEditResources}">--- DKK</p>
                </div>
            </div>
            <div class="flex items-center gap-2 flex-shrink-0" th:if="${canEditResources}">
                <a th:href="@{/resources/{id}/edit (id=${resource.id})}">
                    <button class="bg-gray-900 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-gray-700 transition">
                        Rediger
                    </button>
                </a>
                <form th:action="@{|/resources/${resource.id}/delete|}" method="post"
                      onsubmit="return confirm('Er du sikker på, at du vil slette denne ressource?');">
                    <button class="border border-red-200 text-red-600 px-4 py-2 rounded-lg text-sm font-medium hover:bg-red-50 transition"
                            type="submit">
                        Slet
                    </button>
                </form>
            </div>
        </div>
    </div>

</main>

<footer th:replace="~{fragments/fragments :: footer}"></footer>
</body>
</html>
