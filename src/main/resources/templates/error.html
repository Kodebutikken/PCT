<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="da">
<head>
    <meta charset="UTF-8">
    <title th:text="${status} + ' - Fejl'">Fejl</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-50 flex items-center justify-center">
<main>
    <div class="bg-white border border-gray-200 rounded-xl p-8 w-full max-w-s">
        <h1 class="text-xl font-medium text-red-600 mb-1" th:text="${status} + ' - ' + ${error}">500 - Uventet fejl</h1>
        <p class="text-sm text-gray-500 mb-6">Der opstod en fejl, og vi kunne ikke behandle din anmodning.</p>
        <p class="text-sm" th:text="${message}"></p>
    </div>
</main>
</body>
</html>
