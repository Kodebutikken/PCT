<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="da">
<head>
    <meta charset="UTF-8">
    <title th:text="${status} + ' - ' + ${error}">Fejl</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-50 flex flex-col">
<header th:replace="~{fragments/fragments :: header}"></header>
<main class="flex-1 w-full flex justify-center items-center">
    <div class="bg-white border border-gray-200 rounded-xl p-8 max-w-md">
        <h1 class="text-xl font-medium text-red-600 mb-1" th:text="${status} + ' - ' + ${error}">500 - Uventet fejl</h1>
        <p class="text-sm text-gray-500 mb-6">Der opstod en fejl, og vi kunne ikke behandle din anmodning.</p>
        <p class="text-sm" th:text="${message}"></p>
        <div class="mt-6">
            <button class="bg-gray-900 text-white py-2 px-4 rounded-lg text-sm font-medium hover:bg-gray-700 transition"
                    type="button" onclick="window.history.back()">Tilbage
            </button>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/fragments :: footer}"></footer>
</body>
</html>
